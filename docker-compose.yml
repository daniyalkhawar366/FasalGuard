services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ml_service:
    build:
      context: ./backend/ml_service
      dockerfile: Dockerfile
    env_file:
      - ./backend/config.env
    environment:
      PORT: 5001
      PYTHONUNBUFFERED: 1
    restart: unless-stopped
    volumes:
      - ./backend/ml_models:/app/ml_models:ro
    ports:
      - "5001:5001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/config.env
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:8080
      MONGO_URI: mongodb://mongo:27017/fasalguard
      PYTHON_ML_SERVICE_URL: http://ml_service:5001
      ML_SERVICE_URL: http://ml_service:5001
    restart: unless-stopped
    depends_on:
      - mongo
      - ml_service
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo_data:
